apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketing-deployment
  labels:
    app: ticketing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticketing
  template:
    metadata:
      labels:
        app: ticketing
    spec:
      containers:
      - name: ticketing
        image: techassistpro/ticketing:latest # Replace with your actual image
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: ConnectionStrings__TechAssistDb
          value: "Host=172.232.102.50;Port=5432;Database=techassist_ticketing_dev;Username=techassist;Password=Coder##12" # Replace with actual connection string and secrets management
        - name: ConnectionStrings__RabbitMQ
          value: "amqp://admin:Coder%23%2312@172.232.102.50:5672/"
        - name: OpenTelemetry__Loki__Url
          value: "http://172.232.102.50:3100"
        - name: OpenTelemetry__Otlp__Endpoint
          value: "http://172.232.102.50:4317" # Replace with actual RabbitMQ credentials and secrets management
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: ticketing-service
  labels:
    app: ticketing
spec:
  selector:
    app: ticketing
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

