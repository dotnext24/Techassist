name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Images
        env:
          TAG: ${{ github.sha }}
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -t $USER/techassistpro-ticketing:$TAG -f src/TechAssistPro.Ticketing/Dockerfile .
          docker build -t $USER/techassistpro-scheduling:$TAG -f src/TechAssistPro.Scheduling/Dockerfile .
          docker build -t $USER/techassistpro-customer:$TAG -f src/TechAssistPro.CustomerManagement/Dockerfile .
          docker build -t $USER/techassistpro-gateway:$TAG -f src/TechAssistPro.Gateway/Dockerfile .

          docker push $USER/techassistpro-ticketing:$TAG
          docker push $USER/techassistpro-scheduling:$TAG
          docker push $USER/techassistpro-customer:$TAG
          docker push $USER/techassistpro-gateway:$TAG

  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Ensure namespace & base manifests
        run: |
          kubectl apply -f k8s/deploy/namespace.yaml
          kubectl apply -n techassistpro -f k8s/deploy/

      - name: Update images and pull policy
        env:
          TAG: ${{ github.sha }}
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          kubectl patch deployment ticketing-deployment -n techassistpro \
          --type='json' \
          -p='[
          {"op":"replace","path":"/spec/template/spec/containers/0/image","value":"'"$USER"'/techassistpro-ticketing:'"$TAG"'"},
          {"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Always"}
          ]'

          kubectl patch deployment scheduling-deployment -n techassistpro \
          --type='json' \
          -p='[
          {"op":"replace","path":"/spec/template/spec/containers/0/image","value":"'"$USER"'/techassistpro-scheduling:'"$TAG"'"},
          {"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Always"}
          ]'

          kubectl patch deployment customer-deployment -n techassistpro \
          --type='json' \
          -p='[
          {"op":"replace","path":"/spec/template/spec/containers/0/image","value":"'"$USER"'/techassistpro-customer:'"$TAG"'"},
          {"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Always"}
          ]'

          kubectl patch deployment gateway-deployment -n techassistpro \
          --type='json' \
          -p='[
          {"op":"replace","path":"/spec/template/spec/containers/0/image","value":"'"$USER"'/techassistpro-gateway:'"$TAG"'"},
          {"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Always"}
          ]'      

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/ticketing-deployment -n techassistpro
          kubectl rollout status deployment/scheduling-deployment -n techassistpro
          kubectl rollout status deployment/customer-deployment -n techassistpro
          kubectl rollout status deployment/gateway-deployment -n techassistpro
