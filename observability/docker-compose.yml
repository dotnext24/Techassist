services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - observability 

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "4317:4317"       # OTLP gRPC
      - "4318:4318"       # OTLP HTTP
      - "16686:16686"     # UI
      - "14268:14268"     # Collector
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - observability


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "4000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - observability

  loki-checker:
    image: curlimages/curl:latest
    container_name: loki-checker
    command: >
      sh -c "while true; do
        until curl -sf http://loki:3100/ready; do sleep 2; done;
        echo 'Loki is ready';
        sleep 7200;
      done"
    restart: always

volumes:
  grafana-storage:
  loki-data:

networks:
  observability:
    driver: bridge
